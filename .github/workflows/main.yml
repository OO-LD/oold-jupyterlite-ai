name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      oold_ref:
        description: oold-python ref to build the wheel from; empty uses the PyPI release
        default: ""

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oold-jupyterlite-ai

      # Only when a ref was asked for. Without it the build downloads the released
      # oold wheel, which is the path a clone of this repo alone takes.
      - uses: actions/checkout@v4
        if: inputs.oold_ref != ''
        with:
          repository: OO-LD/oold-python
          ref: ${{ inputs.oold_ref }}
          path: oold-python

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # labextension/ is not tracked and pip does not build it: `npm run build` shells
      # out to jupyter-builder from the venv and pip's subprocess does not inherit it.
      - name: Build the provider extension
        working-directory: oold-jupyterlite-ai/extension
        run: |
          npm ci
          npm run build

      - name: Install
        working-directory: oold-jupyterlite-ai
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -e .[build]
          .venv/bin/python -m pip install --quiet --no-deps ./extension
          npm ci

      - name: Build the reference site
        working-directory: oold-jupyterlite-ai
        env:
          OOLD_SRC: ${{ inputs.oold_ref != '' && format('{0}/oold-python', github.workspace) || '' }}
        run: .venv/bin/python -m oold_jupyterlite_ai.cli build

      - name: Install chromium
        working-directory: oold-jupyterlite-ai
        run: npx playwright install --with-deps chromium

      - name: Suites
        working-directory: oold-jupyterlite-ai
        run: |
          .venv/bin/python -m oold_jupyterlite_ai.cli serve --port 8903 --dir _output &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8903/lab/index.html >/dev/null && break
            sleep 1
          done
          # Each suite is a separate process on purpose: one browser crash should not
          # take the rest of the run with it, and the per-suite counts are the gate.
          status=0
          for suite in run offline kernel-api git providers agent-loop; do
            echo "::group::$suite"
            BASE=http://127.0.0.1:8903 node "tests/$suite.mjs" || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-reports
          path: oold-jupyterlite-ai/artifacts/
          if-no-files-found: ignore
